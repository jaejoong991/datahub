name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: datahub
          POSTGRES_PASSWORD: datahub
          POSTGRES_DB: datahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datahub -d datahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # DATABASE_URL menunjuk ke database admin/dev (`datahub`) di service
    # container — port 5432 di sini, BUKAN 5434 (itu cuma port mapping compose
    # lokal). Harness test (src/test/testEnv.ts) menurunkan URL database test
    # (`datahub_test`) dari variabel ini, jadi satu-satunya sumber kebenaran.
    env:
      DATABASE_URL: postgres://datahub:datahub@localhost:5432/datahub

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx vite build
